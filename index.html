<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <title>生命歷程整理｜助人者時間軸</title>
    <meta name="description" content="以年度、月份、人物、分類與摘要，快速整理可閱讀的生命歷程時間軸。" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="tool-app" id="toolApp">
        <header class="topbar">
          <div>
            <p class="eyebrow">助人者生命歷程</p>
            <h1>把事件放回時間脈絡</h1>
            <p>每筆事件只保留五個必要欄位。</p>
          </div>
          <div class="release-badge" aria-label="版本資訊">
            <span>測試版 v0.41</span>
            <span>更新：2026/08/11（台北時間）</span>
          </div>
        </header>

        <dialog class="input-dialog" id="inputDialog" aria-labelledby="inputDialogTitle">
          <div class="input-dialog-shell">
            <header class="dialog-head input-dialog-head">
              <div><p class="eyebrow">整理生命歷程</p><h2 id="inputDialogTitle">新增事件</h2></div>
              <button class="dialog-close" id="closeInputDialog" type="button" aria-label="關閉新增事件視窗">×</button>
            </header>
            <div class="input-mode-switch" id="inputModeSwitch" role="tablist" aria-label="事件輸入方式">
              <button class="active" id="manualModeButton" type="button" role="tab" aria-selected="true" aria-controls="manualPanel">手動輸入</button>
              <button id="aiModeButton" type="button" role="tab" aria-selected="false" aria-controls="aiPanel">AI 分析</button>
            </div>

            <section class="input-entry" id="inputEntry">

          <section class="manual-panel" id="manualPanel" aria-labelledby="manualTitle" role="tabpanel">
            <div class="panel-head">
              <div><p class="eyebrow">手動輸入</p><h3 id="manualTitle">新增一筆事件</h3></div>
            </div>
            <form id="eventForm" class="event-form">
              <input id="eventId" name="eventId" type="hidden" />
              <div class="date-fields">
                <label>年度
                  <span class="field-hint">民國年</span>
                  <input id="eventYear" name="rocYear" type="number" min="1" max="200" inputmode="numeric" required />
                </label>
                <label>月份
                  <span class="field-hint">不知道可選待確認</span>
                  <select id="eventMonth" name="rocMonth">
                    <option value="">月份待確認</option>
                    <option value="1">1 月</option><option value="2">2 月</option><option value="3">3 月</option>
                    <option value="4">4 月</option><option value="5">5 月</option><option value="6">6 月</option>
                    <option value="7">7 月</option><option value="8">8 月</option><option value="9">9 月</option>
                    <option value="10">10 月</option><option value="11">11 月</option><option value="12">12 月</option>
                  </select>
                </label>
              </div>
              <label>事件人物
                <span class="field-hint">可填姓名或角色稱謂</span>
                <input id="eventActor" name="actor" type="text" maxlength="40" placeholder="例如：王小明、案主、主要照顧者" required />
              </label>
              <label>事件大分類
                <select id="eventLane" name="lane" required>
                  <option value="居住遷移史">居住遷移史</option>
                  <option value="就業與就學史">就業與就學史</option>
                  <option value="感情與家庭史">感情與家庭史</option>
                  <option value="疾病與身心健康史">疾病與身心健康史</option>
                  <option value="社會資源使用歷程">社會資源使用歷程</option>
                  <option value="重大財務事件">重大財務事件</option>
                </select>
              </label>
              <label>事件摘要
                <span class="field-hint">只寫發生什麼事，建議 20–100 字</span>
                <textarea id="eventSummary" name="summary" rows="4" maxlength="300" placeholder="例如：開始餐飲排班工作，因照顧孩子偶爾需要請假。" required></textarea>
              </label>
              <div class="form-status" id="manualStatus" role="status" aria-live="polite"></div>
              <div class="form-actions">
                <button class="primary" id="saveEventButton" type="submit">加入時間軸</button>
                <button class="ghost" id="cancelEditButton" type="button" hidden>取消編輯</button>
              </div>
            </form>
          </section>

          <section class="ai-panel" id="aiPanel" aria-labelledby="aiTitle" role="tabpanel" hidden>
            <div class="panel-head">
              <div><p class="eyebrow">助人者專區・AI 分析</p><h3 id="aiTitle">用文字或語音說明事件</h3></div>
            </div>
            <div class="ai-mode-switch" role="group" aria-label="AI 輸入方式">
              <button class="active" id="aiTextMode" type="button" aria-pressed="true">文字輸入</button>
              <button id="aiVoiceMode" type="button" aria-pressed="false">語音輸入</button>
            </div>
            <div class="voice-controls" id="voiceControls" hidden>
              <button class="primary" id="startVoice" type="button">開始語音輸入</button>
              <button class="ghost" id="stopVoice" type="button">停止</button>
              <span id="voiceStatus" role="status" aria-live="polite">辨識文字會出現在下方，可先修改再分析。</span>
            </div>
            <label id="aiInputLabel" for="aiInputText">輸入或貼上事件內容</label>
            <textarea id="aiInputText" rows="7" placeholder="例如：案主於115年3月開始餐飲排班工作；案母在同年5月開始協助照顧孩子。"></textarea>
            <div class="form-status" id="aiStatus" role="status" aria-live="polite">AI 會把內容拆成事件初稿，月份不確定時會保留待確認。</div>
            <div class="form-actions">
              <button class="primary" id="analyzeButton" type="button">開始 AI 分析</button>
              <button class="ghost" id="useTestText" type="button">填入測試文字</button>
            </div>
            <section class="draft-section" id="draftSection" aria-labelledby="draftTitle" hidden>
              <div class="draft-head"><h4 id="draftTitle">確認事件初稿</h4><span id="draftCount"></span></div>
              <div class="draft-list" id="draftList"></div>
            </section>
          </section>
            </section>
          </div>
        </dialog>

        <section class="timeline-section" id="timelineSection" aria-labelledby="timelineTitle">
          <div class="timeline-title-row">
            <div><p class="eyebrow">閱讀模式</p><h2 id="timelineTitle">生命歷程時間軸</h2><p>分類看直列、時間看橫向；點事件才展開摘要。</p></div>
            <div class="timeline-actions">
              <button class="primary" id="addEventButton" type="button">新增事件</button>
              <button class="ghost" id="openAiButton" type="button">AI 分析</button>
            </div>
          </div>
          <div class="metrics" aria-label="時間軸摘要">
            <div><span>事件</span><strong id="eventMetric">0</strong></div>
            <div><span>人物</span><strong id="actorMetric">0</strong></div>
            <div><span>涵蓋分類</span><strong id="laneMetric">0/6</strong></div>
          </div>
          <div class="timeline-filters" aria-label="時間軸篩選">
            <label>事件人物<select id="actorFilter"><option value="all">全部人物</option></select></label>
            <label>事件大分類<select id="laneFilter"><option value="all">全部分類</option></select></label>
          </div>
          <div class="timeline-navigation" id="timelineNavigation" hidden>
            <button class="nav-button" id="scrollEarlier" type="button" aria-label="查看較早事件">← <span>較早</span></button>
            <div class="timeline-top-rail" id="timelineTopRail" role="region" tabindex="0" aria-label="橫向捲動時間軸">
              <div id="timelineTopSpacer" aria-hidden="true"></div>
            </div>
            <button class="nav-button" id="scrollLater" type="button" aria-label="查看較晚事件"><span>較晚</span> →</button>
          </div>
          <p class="swipe-hint" id="swipeHint" hidden>可左右滑動查看不同時間</p>
          <div class="timeline-scroll" id="timelineScroll">
            <div class="timeline-chart" id="timelineChart" role="region" aria-label="依年月與事件分類排列的生命歷程時間軸"></div>
          </div>
          <div class="timeline-empty" id="timelineEmpty">
            <strong>時間軸還是空的</strong>
            <span>新增第一筆事件，或使用 AI 分析一段事件資料。</span>
            <div class="empty-actions">
              <button class="primary" id="emptyAddEventButton" type="button">新增第一筆事件</button>
              <button class="ghost" id="emptyAiButton" type="button">使用 AI 分析</button>
            </div>
          </div>
        </section>
      </section>
    </main>

    <dialog class="event-dialog" id="eventDialog" aria-labelledby="dialogTitle">
      <div class="dialog-head"><div><p class="eyebrow">事件摘要</p><h2 id="dialogTitle">事件</h2></div><button class="dialog-close" id="closeDialog" type="button" aria-label="關閉事件摘要">×</button></div>
      <dl class="event-detail" id="eventDetail"></dl>
      <div class="dialog-actions">
        <button class="primary" id="editDialogEvent" type="button">編輯這筆事件</button>
        <button class="danger" id="deleteDialogEvent" type="button">刪除此事件</button>
      </div>
    </dialog>

    <script src="./app.js"></script>
  </body>
</html>
